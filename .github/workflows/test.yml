# 뷰어 시험과 이미지 (ForGIA 의 test.yml 과 같은 꼴).
#
# **배포는 여기서 안 한다.** deploy.sh 는 사람이 부른다 — 기동 게이트·smoke 가
# 거기 붙어 있다. 태그(v*)를 밀면 시험을 통과한 이미지만 Docker Hub 로 올라간다.
name: 시험

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 뷰어 시험
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-web.txt
      # 학회 자료 파일이 전부 검사를 통과하는가도 여기서 본다 (test_data_files)
      - run: python web/manage.py test conference --verbosity 2

  build:
    name: 이미지 굽기
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Docker Hub 로그인
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 태그일 때만 올린다. 그 밖에는 굽기만 해서 Dockerfile 이 깨진 것을 잡는다
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: koprifossillab/confoinfo:${{ github.ref_type == 'tag' && github.ref_name || 'ci' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
