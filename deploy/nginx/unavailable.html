<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10">
<title>Unavailable — confoinfo</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    font: 15px/1.7 ui-sans-serif, system-ui, "Noto Sans KR", sans-serif;
    background: #0f1115; color: #e6e9ef;
  }
  @media (prefers-color-scheme: light) {
    body { background: #f6f7f9; color: #1a1d23; }
    .box { background: #fff; border-color: #e0e3e9; }
    .dim { color: #6b7280; }
    code { background: #f0f1f4; }
  }
  .box {
    max-width: 440px; margin: 20px; padding: 26px 28px;
    background: #171a21; border: 1px solid #262b36; border-radius: 12px;
  }
  h1 { margin: 0 0 10px; font-size: 17px; }
  p { margin: 0 0 8px; }
  .dim { color: #8b93a3; font-size: 13px; }
  code {
    font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
    background: #0e0e11; padding: 1px 5px; border-radius: 4px;
  }
  /* confoinfo 표시. nginx 가 그냥 파일로 내는 자리라 Django 템플릿을 못 쓴다 */
  .brand {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px; color: #6fa8dc;
  }
  .brand .logomark { width: 26px; height: 26px; flex: 0 0 auto; display: block; }
  .brand .wordmark { font-size: 15px; font-weight: 750; letter-spacing: .3px; }
</style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <span class="logomark" style="font-size:22px;line-height:26px">🗓️</span>
      <span class="wordmark">confoinfo</span>
    </div>
    <h1>The planner is not responding</h1>
    <p>The server is up but the planner app is not answering.</p>
    <p class="dim">If an update is in progress it will be back shortly — this page
       retries every 10 seconds. 몇 분이 지나도 그대로면 컨테이너가 멈춘 것입니다.</p>
    <p class="dim">확인: <code>cd /srv/confoinfo &amp;&amp; docker compose ps</code></p>
  </div>
</body>
</html>
