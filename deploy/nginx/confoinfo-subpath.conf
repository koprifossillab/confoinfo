# confoinfo 를 80 포트의 /confoinfo/ 아래에 얹는다. ForGIA-subpath.conf 와 같은 꼴이다.
#
# 사내 VPN 이 80 만 통과시키고, 이 머신의 80 은 phyloserver 블록
# (`server_name 172.16.116.98 paleolab`)이 잡고 있어 서브경로로 넣는다 —
# DiaRUGA·ForGIA 가 같은 블록에 나란히 있다.
#
# 설치 (sudo):
#   sudo cp deploy/nginx/confoinfo-subpath.conf /etc/nginx/snippets/confoinfo-subpath.conf
#   # /etc/nginx/sites-available/phyloserver 의 server 블록 안에 한 줄:
#   #     include snippets/confoinfo-subpath.conf;
#   sudo nginx -t && sudo systemctl reload nginx

# --- 점검 안내 -------------------------------------------------------------
# deploy.sh 가 maintenance.flag 를 세우는 동안 맨 502 대신 안내를 낸다.
# `error_page 503 = /…` 처럼 `=` 를 쓰면 상태가 200 으로 바뀐다 — 쓰지 않는다.
location = /confoinfo-maintenance.html {
    internal;
    root /srv/confoinfo/www;
    add_header Cache-Control "no-store" always;
}
location = /confoinfo-unavailable.html {
    internal;
    root /srv/confoinfo/www;
    add_header Cache-Control "no-store" always;
}

# 뿌리로 들어오면 슬래시를 붙여 보낸다. 이게 없으면 Django 가 /confoinfo 를 못 찾는다.
location = /confoinfo {
    return 301 /confoinfo/;
}

# 대소문자를 틀리게 친 주소(/ConfoInfo/ 등)를 정식 주소로. 정식 주소까지 잡아채면
# 무한 루프라 아래 블록에 `^~` 를 붙였다 (ForGIA-subpath.conf 의 설명).
location ~* ^/(confoinfo)(/.*)?$ {
    return 301 /confoinfo$2;
}

location ^~ /confoinfo/ {
    if (-f /srv/confoinfo/maintenance.flag) { return 503; }
    error_page 503 /confoinfo-maintenance.html;
    error_page 502 504 /confoinfo-unavailable.html;
    proxy_intercept_errors on;

    # **끝의 슬래시가 핵심이다** — nginx 가 /confoinfo/ 를 떼고 넘긴다. Django 는
    # 뿌리에 붙은 것처럼 해석하고 링크를 만들 때만 CONFOINFO_SCRIPT_NAME 을 붙인다.
    proxy_pass http://127.0.0.1:8096/;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
